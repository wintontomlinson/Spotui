name: Build & Release APK

# Builds the release APK(s) and publishes them to a GitHub Release so they can be
# downloaded directly — no local Android SDK needed.
#
# The version CHANGES ON EVERY BUILD so each APK is unique and installs over the
# previous one:
#   • push a tag like v2.0.1            → versionName = 2.0.1 (from the tag)
#   • "Run workflow" (manual dispatch)  → versionName = <base>.<run#> (e.g. 2.0.0.7)
# versionCode is always base + run number, i.e. strictly increasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compute a version that CHANGES ON EVERY BUILD so no two APKs collide.
      #   • On a tag push (vX.Y.Z)  → versionName = X.Y.Z (from the tag)
      #   • Otherwise (manual/auto) → base versionName from build.gradle + ".<run#>"
      # versionCode is ALWAYS unique: base-code * 100000 + GITHUB_RUN_NUMBER, so
      # every build is a strictly higher, installable-over-the-top upgrade.
      - name: Compute changing version
        id: ver
        run: |
          BASE=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          BASECODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VN="${GITHUB_REF_NAME#v}"       # strip leading v from the tag
          else
            VN="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          VC=$(( ${BASECODE:-1} + GITHUB_RUN_NUMBER ))
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Building version $VN (code $VC)"

      # Inject the computed version into build.gradle.kts so the APK filename,
      # versionName and versionCode all reflect this specific build.
      - name: Apply version to build.gradle.kts
        run: |
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.ver.outputs.version }}\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ steps.ver.outputs.code }}/" app/build.gradle.kts
          grep -nE "versionName|versionCode" app/build.gradle.kts | head -2

      # Release is signed with the in-repo shared debug keystore (see
      # app/build.gradle.kts), so no signing secrets are required here.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-v${{ steps.ver.outputs.version }}-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publish to a GitHub Release with a version that changes every build, so a
      # new build never overwrites the previous one. On a tag push it uses the tag;
      # otherwise a fresh v<version> tag (which already carries the run number).
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Spotui v${{ steps.ver.outputs.version }}
          body: |
            Automated build of **Spotui v${{ steps.ver.outputs.version }}** (versionCode ${{ steps.ver.outputs.code }}).

            Download the universal APK below (installs on any device), or a
            per-architecture APK (`arm64-v8a` for most modern phones).
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
