name: Build & Release APK

# Builds the release APK(s) and publishes them to a GitHub Release so they can be
# downloaded directly — no local Android SDK needed.
#
# Triggers:
#   • push a tag like v2.0.0            → builds and creates/updates that release
#   • "Run workflow" (manual dispatch)  → builds and attaches to a release named
#                                          after the version in app/build.gradle.kts
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version name
        id: ver
        run: |
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "App version: $VN"

      # Release is signed with the in-repo shared debug keystore (see
      # app/build.gradle.kts), so no signing secrets are required here.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-v${{ steps.ver.outputs.version }}-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publish to a GitHub Release. On a tag push, uses the tag; on manual
      # dispatch, uses v<versionName> and (re)creates that release.
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Spotui v${{ steps.ver.outputs.version }}
          body: |
            Automated build of Spotui v${{ steps.ver.outputs.version }}.

            Download the universal APK below (installs on any device), or a
            per-architecture APK (`arm64-v8a` for most modern phones).
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
