name: Build APK

# Builds the debug + release APKs on GitHub's runners (no local Android SDK
# needed). Trigger it three ways:
#   • manually from the Actions tab (workflow_dispatch),
#   • automatically on every push to main / feature branches,
#   • on a version tag (v*), which also publishes the APKs to a GitHub Release.
#
# After a run finishes, download the APK from the run's "Artifacts" section
# (bottom of the run summary page). Tagged builds additionally attach the APKs
# to a downloadable Release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'royal-gradient-explore-autorefresh'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          # Also publish a stable, version-independent copy so a single
          # "latest" download link always works:
          #   https://github.com/<owner>/<repo>/releases/latest/download/Spotui-latest.apk
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/Spotui-latest.apk
          fi
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-APKs
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish to Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
